name: Validate and publish KROK Agent Swarm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      request:
        description: 'Simple-language request for the swarm'
        required: false
        default: 'перевір публічні джерела'
      topic:
        description: 'Topic for generated website content'
        required: false
        default: 'актуальні цифрові рішення для бізнесу'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML and scripts
        run: |
          test -s index.html
          python -m py_compile agents/*.py
          grep -q 'swarm-ui.js' index.html
          ! grep -RInE 'sk-[A-Za-z0-9]|ghp_[A-Za-z0-9]|AIza[A-Za-z0-9_-]{20,}|password[[:space:]]*=' . --exclude-dir=.git
      - name: Run demo orchestrator
        run: python agents/orchestrator.py "${{ inputs.request || 'перевір публічні джерела' }}"
      - name: Collect public social sources
        run: python agents/social_sources.py social-sources.json > artifacts/social-results.json
      - name: Generate cited content draft
        env:
          CONTENT_TOPIC: ${{ inputs.topic || 'актуальні цифрові рішення для бізнесу' }}
        run: python agents/content_pipeline.py artifacts/social-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: swarm-result
          path: artifacts/

      - name: Commit generated content draft
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'krok-agent-swarm[bot]'
          git config user.email 'krok-agent-swarm[bot]@users.noreply.github.com'
          mkdir -p generated
          cp artifacts/generated-content.json generated/latest-content.json
          git add generated/latest-content.json
          git commit -m "chore: update generated content draft" || echo 'No content changes'
          git push

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
